plugins {
    id 'java'
    id 'war'
}

group 'org.zerock'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    // Spring dependencies
    implementation("org.springframework:spring-core:6.2.3")
    implementation("org.springframework:spring-context:6.2.3")
    testImplementation("org.springframework:spring-test:6.2.3")
    implementation("org.springframework:spring-webmvc:6.2.3")
    implementation("org.springframework:spring-jdbc:6.2.3")
    implementation("org.springframework:spring-tx:6.2.3")

    // Lombok
    implementation("org.projectlombok:lombok:1.18.30")
    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")
    testCompileOnly("org.projectlombok:lombok:1.18.30")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.30")

    // Log4j2
    implementation("org.apache.logging.log4j:log4j-core:2.21.1")
    implementation("org.apache.logging.log4j:log4j-api:2.21.1")
    implementation("org.apache.logging.log4j:log4j-slf4j2-impl:2.21.1")

    // JSTL
    implementation("jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0")
    implementation("org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1")

    // MariaDB
    implementation("org.mariadb.jdbc:mariadb-java-client:3.0.4")

    // HikariCP
    implementation("com.zaxxer:HikariCP:5.0.1")

    // MyBatis (Spring 6 compatible)
    implementation("org.mybatis:mybatis-spring:3.0.3")
    implementation("org.mybatis:mybatis:3.5.14")

    // ModelMapper
    implementation("org.modelmapper:modelmapper:3.1.0")

    // Hibernete-Validate
    implementation("org.hibernate.validator:hibernate-validator:6.2.1.Final")
}

test {
    useJUnitPlatform()
}
